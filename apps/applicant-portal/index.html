<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Browse open grants, scholarships and opportunities, check your eligibility, and apply online. Save your progress and come back any time." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141210" />
    <title>Apply for grants and opportunities</title>
    <script>
      // Match the device's light or dark setting before first paint, so nobody sees a white flash.
      (function () {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
