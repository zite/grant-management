<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grant Management — applications, review, decisions and awards for grantmakers and nonprofits." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d10" />
    <title>Grant Management</title>
    <script>
      // Apply the theme before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var t = localStorage.getItem('grants:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
